<div class="modal-root" data-block="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel">
      <button class="modal__close" type="button" data-modal-close aria-label="Закрыть">×</button>
      <h2 class="modal__title" id="modal-title"></h2>
      <div class="modal__body"></div>
    </div>
  </div>

  <!-- Hotel gallery modal -->
  <div class="modal modal--gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden data-modal-type="gallery">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel modal__panel--wide">
      <button class="modal__close" type="button" data-modal-close aria-label="Закрыть">×</button>
      <h2 class="modal__title" id="gallery-title"></h2>
      <div class="modal__gallery"></div>
    </div>
  </div>
</div>

<!-- Static modal content templates -->
<template id="modal-company">
  <p><strong>Реквизиты компании</strong></p>
  <p>Заполните данные в <code>core/site.json</code> → секция <code>legal</code>.</p>
  <p><a href="https://tourism.gov.ru/operators/" target="_blank" rel="noopener noreferrer">Единый федеральный реестр турагентов</a></p>
</template>

<template id="modal-copyright">
  <p>Все материалы сайта culture-travel.ru защищены авторским правом.</p>
  <p>Копирование текстов, фотографий и видеоматериалов без письменного согласия правообладателя запрещено.</p>
</template>
