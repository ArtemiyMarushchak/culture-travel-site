<header class="lh" id="lux-header" data-block="header">
  <div class="lh__inner">
    <a class="lh__logo" href="{{basePath}}/" aria-label="Культура путешествий — на главную">
      <img class="lh__logo-mark" src="{{basePath}}/assets/icons/logo-mark-white.svg" alt="" width="32" height="32" decoding="async">
      <span class="lh__logo-text" aria-hidden="true">
        <span class="lh__logo-line">Культура</span>
        <span class="lh__logo-line">Путешествий</span>
      </span>
    </a>

    <nav class="lh__nav" aria-label="Основная навигация">
      {{#each nav}}
      <a
        class="lh__nav-link"
        href="{{basePath}}{{href}}"
        data-anchor="{{anchor}}"
      >{{label}}</a>
      {{/each}}
    </nav>

    <div class="lh__actions">
      <a class="lh__cta" href="{{telegram}}" target="_blank" rel="noopener noreferrer">
        <svg class="lh__cta-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M13 6h6v2h-6V6Zm3 3c-6.3 0-11.43 4.84-11.94 11H2v5h28v-5h-2.06C27.43 13.84 22.3 9 16 9Zm0 2c5.23 0 9.45 3.91 9.94 9H6.06C6.55 14.91 10.77 11 16 11ZM4 22h24v1H4v-1Z"/>
        </svg>
        <span>Связаться</span>
      </a>
    </div>

    <button class="lh__burger" type="button" aria-expanded="false" aria-controls="lh-topmenu" aria-label="Открыть меню">
      <span class="lh__burger-box" aria-hidden="true">
        <i></i><i></i><i></i>
      </span>
    </button>
  </div>

  <div class="lh__topmenu" id="lh-topmenu" aria-hidden="true">
    <div class="lh__topmenu-inner">
      <nav class="lh__menu-links" aria-label="Мобильное меню">
        {{#each nav}}
        <a
          class="lh__menu-link"
          href="{{basePath}}{{href}}"
          data-anchor="{{anchor}}"
        >{{label}}</a>
        {{/each}}
      </nav>
      <a class="lh__menu-cta" href="{{telegram}}" target="_blank" rel="noopener noreferrer">
        <span>Связаться</span>
        <svg class="lh__cta-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M13 6h6v2h-6V6Zm3 3c-6.3 0-11.43 4.84-11.94 11H2v5h28v-5h-2.06C27.43 13.84 22.3 9 16 9Zm0 2c5.23 0 9.45 3.91 9.94 9H6.06C6.55 14.91 10.77 11 16 11ZM4 22h24v1H4v-1Z"/>
        </svg>
      </a>
    </div>
  </div>
</header>
