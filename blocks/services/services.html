<section id="anna-services" class="uc-services" data-block="services" aria-labelledby="anna-services-title">
  <div class="sv">
    <div class="sv__head">
      <p class="sv__overline">{{overline}}</p>
      <h2 class="sv__title" id="anna-services-title">{{title}}</h2>
      <p class="sv__lead">{{lead}}</p>
    </div>

    <div class="sv__grid">
      {{#each items}}
      <article class="sv__card">
        <div class="sv__card-top">
          <span class="sv__index">{{indexPad}}</span>
          <span class="sv__line" aria-hidden="true"></span>
        </div>
        <h3 class="sv__card-title">{{title}}</h3>
        <p class="sv__card-text">{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
