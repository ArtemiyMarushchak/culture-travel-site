<section class="contact section" id="contact" data-block="contact-footer">
  <div class="container container--narrow text-center">
    <p class="section__label" data-i18n="contact.label">Контакты</p>
    <h2 class="section__title" data-i18n="contact.title">Обсудим ваше путешествие</h2>
    <p class="type-lead mb-lg" data-i18n="contact.lead">Работаем только с индивидуальными запросами. Напишите — и мы создадим маршрут специально для вас.</p>

    <div class="contact__actions">
      <a class="btn btn--solid" href="mailto:{{email}}" data-i18n="contact.write">Написать на email</a>
    </div>
  </div>
</section>
