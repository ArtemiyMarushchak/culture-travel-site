<section class="news-list section" data-block="news-list">
  <div class="container">
    <p class="section__label">Новости</p>
    <h1 class="section__title">Из мира Culture Travel</h1>

    <div class="news-list__grid">
      {{#each items}}
      <article class="news-list__item">
        <a class="news-list__card" href="{{basePath}}/news/{{slug}}/">
          <span class="news-list__media">
            <img src="{{basePath}}{{cover}}" alt="" loading="lazy" decoding="async" width="720" height="480">
          </span>
          <span class="news-list__body">
            <time datetime="{{dateIso}}">{{dateFormatted}}</time>
            <h2>{{title}}</h2>
            <p>{{excerpt}}</p>
          </span>
        </a>
      </article>
      {{/each}}
    </div>
  </div>
</section>
