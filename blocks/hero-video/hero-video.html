<div class="uc-video" data-block="hero-video">
  <div
    id="avb"
    data-aspect="16/9"
    data-fallback="{{basePath}}/assets/images/hero/poster.jpg"
  >
    <div class="avb__fallback"></div>
    <div class="avb__carrier">
      <video
        id="avbFrame"
        src="{{basePath}}/assets/videos/hero.mp4"
        poster="{{basePath}}/assets/images/hero/poster.jpg"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        disablepictureinpicture
        disableremoteplayback
        pip="false"
        controlslist="nodownload nofullscreen noremoteplayback"
        aria-hidden="true"
        tabindex="-1"
      ></video>
    </div>
    <div class="avb__overlay"></div>
    <div class="avb__content">
      <div class="avb__inner">
        <div class="avb__copy">
          <h1 class="avb__title" data-i18n="hero.title">Открываем мир за кадром</h1>
          <p class="avb__lead" data-i18n="hero.lead">Организуя путешествия с вниманием к каждой детали</p>
        </div>
      </div>
    </div>
  </div>
</div>
