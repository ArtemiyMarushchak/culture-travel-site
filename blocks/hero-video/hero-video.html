<section class="hero-video" data-block="hero-video" aria-label="Culture Travel — главный экран">
  <div class="hero-video__media">
    <video
      class="hero-video__video"
      autoplay
      muted
      loop
      playsinline
      poster="{{basePath}}/assets/images/placeholder.svg"
      aria-hidden="true"
    >
      <source src="{{basePath}}/assets/videos/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-video__overlay"></div>
  </div>

  <div class="hero-video__content container">
    <p class="hero-video__label">Culture Travel</p>
    <h1 class="hero-video__title">Режиссёр индивидуальных туров</h1>
    <p class="hero-video__subtitle">Создаю VIP-путешествия для discerning travelers — без массового туризма, с абсолютным вниманием к деталям.</p>
    <a class="btn btn--solid hero-video__cta" href="#contact">Связаться</a>
  </div>
</section>
