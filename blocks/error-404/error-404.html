<section class="uc-404" data-block="error-404" aria-labelledby="page-404-title">
  <div class="uc-404__inner">
    <div class="uc-404__code">404</div>
    <h1 class="uc-404__title" id="page-404-title">Страница не найдена</h1>
    <p class="uc-404__text">
      Возможно, адрес был изменён или страница временно недоступна.
      Вернитесь на главную страницу или свяжитесь со мной,
      чтобы продолжить планирование путешествия.
    </p>
    <div class="uc-404__actions">
      <a class="uc-404__link uc-404__link--primary" href="{{basePath}}/">На главную</a>
      <a class="uc-404__link" href="{{telegram}}" target="_blank" rel="noopener noreferrer">Связаться</a>
    </div>
  </div>
</section>
