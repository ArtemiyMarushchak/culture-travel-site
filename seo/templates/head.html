<!--
  Шаблон <head> для каждой страницы.
  SEO-теги, CSP, иконки и единственный main.css.
  Плейсхолдеры вроде {{title}} подставляет tools/build.mjs.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Крышка первого кадра — до fonts/boot/main.css (без белого FOUC) */
  html {
    background: #0d0d0d;
  }

  html.is-preloading,
  html.is-preloading body {
    overflow: hidden !important;
    background: #0d0d0d !important;
  }

  html.is-preloading body > *:not(#ct-preloader) {
    visibility: hidden !important;
  }

  /* Показать страницу под уходящей крышкой (без чёрной дыры / скачка) */
  html.is-preloading.is-preloaded body > *:not(#ct-preloader) {
    visibility: visible !important;
  }

  html.is-preloading #ct-preloader {
    position: fixed !important;
    inset: 0 !important;
    z-index: 2147483000 !important;
    display: flex !important;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #0d0d0d !important;
    color: #fff !important;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  html.is-preloading.is-preloaded #ct-preloader {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  html.is-preloading #ct-preloader .ct-preloader__mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px;
  }

  html.is-preloading #ct-preloader .ct-preloader__line {
    display: block;
    width: 48px;
    height: 1.5px;
    background: #A6865D;
    transform-origin: center;
    animation: ct-preloader-line 1.1s ease-in-out infinite;
  }

  html.is-preloading #ct-preloader .ct-preloader__brand {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    opacity: 0.72;
  }

  @keyframes ct-preloader-line {
    0%, 100% { transform: scaleX(0.35); opacity: 0.45; }
    50% { transform: scaleX(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    html.is-preloading #ct-preloader {
      transition-duration: 0.01ms;
    }

    html.is-preloading #ct-preloader .ct-preloader__line {
      animation: none;
      opacity: 0.8;
    }
  }
</style>
<meta name="theme-color" content="{{themeColor}}" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="{{themeColor}}" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="{{themeColor}}">
<link rel="preload" href="{{basePath}}/assets/fonts/montserrat/montserrat-semibold-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{basePath}}/assets/fonts/montserrat/montserrat-semibold-latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="{{basePath}}/core/boot.js?v={{buildId}}"></script>
<style>
  @font-face {
    font-family: 'Montserrat';
    src: url('{{basePath}}/assets/fonts/montserrat/montserrat-semibold-cyrillic.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Montserrat';
    src: url('{{basePath}}/assets/fonts/montserrat/montserrat-semibold-latin.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
</style>
