<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index, follow">
<meta name="author" content="{{author}}">

<!-- Open Graph -->
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:url" content="{{ogUrl}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:locale" content="{{locale}}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{ogDescription}}">
<meta name="twitter:image" content="{{ogImage}}">

<!-- Security -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

<!-- Icons -->
<link rel="icon" href="{{basePath}}/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="{{basePath}}/site.webmanifest">
<meta name="theme-color" content="#0a0a0a">

<!-- Styles -->
<link rel="stylesheet" href="{{basePath}}/styles/main.css">

{{jsonLd}}
